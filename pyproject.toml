[project]
name = "rag-mcp-research"
version = "0.1.0"
description = "A research assistant for citation-grounded answers over ML papers."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "sentence-transformers",
    "torch==2.15.0",
    "faiss-cpu",
    "pypdf",
    "numpy",
    "rank-bm25>=0.2.2",
    "openai>=3.57.0",
    "mcp>=2,<3",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# PyTorch is already required by sentence-transformers. Select CPU wheels on Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
